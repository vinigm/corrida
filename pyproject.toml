[project]
name = "corrida"
version = "0.1.0"
description = "Pipeline pessoal de corrida: Garmin -> dashboard HTML de evolucao"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "numpy",
    "pandas",
    "garmin-fit-sdk",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corrida"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
